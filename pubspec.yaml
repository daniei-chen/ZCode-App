name: zremote
description: "ZCode App — ZCode 桌面端远程控制的移动端伴侣：扫码导入，多设备并行会话，生物识别门禁。"
publish_to: 'none'

version: 1.1.1+12

environment:
  # 与 pubspec.lock 的实际解析下界一致（scripts/check-doc-drift.py 会校验）。
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  http: ^1.6.0
  flutter_inappwebview: ^6.1.5
  mobile_scanner: ^7.4.0
  # 11.1.0 uses Flutter's compileSdkVersion (36) instead of pinning API 37,
  # so it remains compatible with the Flutter 3.47 / AGP 8.11 build chain.
  flutter_secure_storage: ^11.1.1
  local_auth: ^3.0.2
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/brand/mark.png
