name: ci-heavy

# 重 CI（v1.1.0 CI 分层）：Android 构建与模拟器 E2E 只在相关路径变更时
# 触发；纯文档/说明提交只跑 fast check（ci.yml），不再烧十几分钟。
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
  # PR 上不过滤路径：android 是 main 的必需检查，PR 必须始终上报结论，
  # 否则纯文档 PR 会因必需检查缺席被永久 BLOCKED（首次治理实跑发现）。
  pull_request:
  workflow_dispatch:
  schedule:
    # 每夜 18:00 UTC（北京时间 02:00）跑模拟器矩阵：不阻塞 PR，
    # 但为发布门禁积累连续通过证据（PR08）。
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  # Android 可构建性巡检：出 debug 包，防 Android 侧悄悄烂掉（阻断检查）。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

  # Android 模拟器 E2E：真机环境跑 integration_test（非必需检查）。
  # PR08：单一测试入口（只为一次 build+install 付费）、Gradle 缓存、
  # 预装 CMake、分阶段超时、失败留存 logcat/测试日志；每夜与手动触发运行，
  # 连续稳定通过后再讨论恢复为发布必需门禁。
  android-emulator:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      # Gradle 依赖缓存：冷缓存下 assembleDebug 实测 386s，命中后显著缩短。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      # 预装 CMake：否则 Flutter 构建中途现场下载（实测约 2 分钟）。
      - name: Preinstall CMake used by the Android build
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" "cmake;3.22.1" >/dev/null 2>&1 || true
          fi

      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          script: |
            timeout 1500 flutter test integration_test || status=$?
            if [ "${status:-0}" -ne 0 ]; then
              adb logcat -d > "logcat-api${{ matrix.api-level }}.txt" 2>&1 || true
            fi
            exit ${status:-0}

      # 失败也要留证据：logcat 供定位环境/进程问题（if: always）。
      - name: Upload emulator failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-logs-api${{ matrix.api-level }}
          if-no-files-found: ignore
          path: logcat-api*.txt
