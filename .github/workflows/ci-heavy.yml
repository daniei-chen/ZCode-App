name: ci-heavy

# 重 CI（v1.1.0 CI 分层）：Android 构建与模拟器 E2E 只在相关路径变更时
# 触发；纯文档/说明提交只跑 fast check（ci.yml），不再烧十几分钟。
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
  # PR 上不过滤路径：android 是 main 的必需检查，PR 必须始终上报结论，
  # 否则纯文档 PR 会因必需检查缺席被永久 BLOCKED（首次治理实跑发现）。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Android 可构建性巡检：出 debug 包，防 Android 侧悄悄烂掉（阻断检查）。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

  # Android 模拟器冒烟：真机环境跑 integration_test（非必需检查）。
  # v1.1.0（先落地 PR08 的最小动作）：实测无 KVM runner 上 API 34 单作业需
  # 启动 745s + 构建 386s + 安装 318s，30 分钟预算必然被取消；因此把矩阵移出
  # push/PR（只保留手动触发），避免每次变更白烧 ~60 runner-分钟。
  # PR08 将补齐：单入口预构建 APK、分阶段超时、失败留 JUnit/logcat，
  # 连续稳定通过后再恢复为每夜/按需的发布门禁。
  android-emulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          # 测试阶段硬性上限：作业超时是兜底，这里给测试本身封顶，避免静默挂死。
          script: timeout 1500 flutter test integration_test
