name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 快速门禁（v1.1.0 CI 分层）：analyze + test，每次 push/PR 必跑。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # 发布门禁脚本的行为自测（成功 / 篡改摘要 / 缺字段 / attestation 不匹配等负例）。
      - run: python3 scripts/verify-release-artifacts.py --self-test
      # 注入脚本（观测钩子 + 跳转脚本）藏在 Dart 字符串里，analyze 覆盖不到：
      # 语法 + 边界行为断言（超限文本不得过桥、非默认端口/跨域 query 不得获得
      # 观察权限、跳转必须回执 found/timeout/superseded 且带主 frame 令牌）。
      - run: node scripts/check_injected_js.mjs

  # 依赖评审（仅 PR）：新增依赖的漏洞/许可证检查。
  # 非必需检查、不阻断合并：新建仓库的 Dependency Graph 数据生成前该动作会
  # 直接报 "not supported"（已开启 vulnerability-alerts 触发索引），图数据就绪
  # 后自动开始正常报告。
  dependency-review:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # 官方 first-party action，已固定到 commit SHA（v4.9.0）。
      # 依赖图数据就绪后按计划（PR19）评估移除 continue-on-error。
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
