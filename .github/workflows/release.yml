name: release

# 发布信任链（v1.1.0 / PR18*）。顺序不可调换：
#   verify（来源门禁）→ build-sign（唯一接触 keystore 的作业）→ publish（校验/证明/发布）
# 任何密钥只在 build-sign 恢复，并在构建后立即删除；publish 是独立作业，
# 从不接触签名材料。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "演练：构建并签名、跑完整校验链，但不发布（tag 上触发时才生效）"
        type: boolean
        default: false
      allow_ancestor:
        description: "允许发布提交是 main 的祖先而非 main HEAD（补救性重跑，默认关闭）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) 来源门禁：在恢复任何密钥之前，证明"要签的就是受保护 main 上的代码"。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # PR24/F23：文档与代码的漂移在发布前就必须拦住（SDK 下界、支持范围 vs
      # minSdk、文档里的版本复述、关键文档可达性、脚本行尾）。
      - name: Documentation anti-drift
        run: python3 scripts/check-doc-drift.py

      # PR24/F26：发行说明与 tag 必须同时存在且写明版本——审计点名的治理缺口
      # 正是"发版靠记忆、文档与实物不一致"。
      - name: Verify release notes match the tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/v${VERSION}.md"
          if [ ! -f "${NOTES}" ]; then
            echo "REFUSED: missing release notes ${NOTES}" >&2
            echo "Create docs/releases/v${VERSION}.md describing this release before tagging." >&2
            exit 1
          fi
          if ! grep -q "${VERSION}" "${NOTES}"; then
            echo "REFUSED: ${NOTES} does not mention version ${VERSION}" >&2
            exit 1
          fi
          echo "release notes OK: ${NOTES}"

      - name: Verify provenance (tag version + commit must come from protected main)
        id: provenance
        env:
          ALLOW_ANCESTOR: ${{ inputs.allow_ancestor }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          if [ -z "${PUBSPEC_VERSION}" ]; then
            echo "cannot read version from pubspec.yaml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${PUBSPEC_VERSION}" ]; then
              echo "REFUSED: tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${PUBSPEC_VERSION}" >&2
              exit 1
            fi
          else
            echo "workflow_dispatch on ${GITHUB_REF_NAME}: tag/pubspec check skipped (dry_run=${DRY_RUN})"
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "REFUSED: ${GITHUB_SHA} is not an ancestor of origin/main." >&2
            echo "Signed releases may only be produced from commits merged into protected main." >&2
            exit 1
          fi
          MAIN_HEAD="$(git rev-parse origin/main)"
          if [ "${MAIN_HEAD}" != "${GITHUB_SHA}" ]; then
            if [ "${ALLOW_ANCESTOR}" = "true" ]; then
              echo "WARNING: ${GITHUB_SHA} is an ancestor of main but not main HEAD (${MAIN_HEAD}); allowed by explicit input"
            else
              echo "REFUSED: ${GITHUB_SHA} is not the current main HEAD (${MAIN_HEAD})." >&2
              echo "If an intentional re-release is required, run workflow_dispatch with allow_ancestor=true." >&2
              exit 1
            fi
          fi

          echo "version=${PUBSPEC_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "provenance OK: ${GITHUB_SHA} (version ${PUBSPEC_VERSION})"

  # 2) 唯一接触签名密钥的作业：构建 → 校验 → 立即删除密钥材料 → 产出候选资产。
  #    dry_run 只影响 publish：演练要覆盖"真的能签出包"这一段，否则演练没有意义
  #    （审计要求演练能证明整条链，而不是只证明门禁分支）。
  build-sign:
    needs: verify
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # production 环境承载发布审批（审阅者可先于密钥恢复拦截发布）。
    environment: production
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 版本与签名身份连续性：读不到上一稳定版 manifest 一律拒绝发布（fail-closed）。
      # 注意：v1.1.0 计划先发 Pre-release，因此 releases/latest 在转正前仍指向
      # 上一个正式版；这只会放宽"比较对象"，不会放宽递增与同签名要求本身。
      - name: Verify versionCode advance and signer continuity vs previous stable release
        run: |
          set -euo pipefail
          VERSION_CODE="$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')"
          PREV_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-manifest.json"
          if ! curl -fsSL --retry 3 --retry-all-errors --max-time 30 "${PREV_URL}" -o prev-manifest.json; then
            echo "REFUSED: cannot read previous stable release manifest at ${PREV_URL}" >&2
            echo "Without it, versionCode advance / signer continuity cannot be proven." >&2
            exit 1
          fi
          PREV_CODE="$(python3 -c 'import json;print(json.load(open("prev-manifest.json"))["versionCode"])')"
          PREV_SIGNER="$(python3 -c 'import json;print((json.load(open("prev-manifest.json")).get("apk") or {}).get("signerSha256","").lower())')"
          if [ -z "${PREV_CODE}" ] || [ -z "${PREV_SIGNER}" ]; then
            echo "REFUSED: previous manifest is missing versionCode or apk.signerSha256" >&2
            exit 1
          fi
          if [ "${VERSION_CODE}" -le "${PREV_CODE}" ]; then
            echo "REFUSED: versionCode ${VERSION_CODE} must be greater than published ${PREV_CODE}" >&2
            exit 1
          fi
          echo "PREV_VERSION_CODE=${PREV_CODE}" >> "${GITHUB_ENV}"
          echo "PREV_SIGNER_SHA256=${PREV_SIGNER}" >> "${GITHUB_ENV}"
          echo "previous stable: versionCode=${PREV_CODE} signer=${PREV_SIGNER}"

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get
      # PR19/F22：SBOM 依赖 PyYAML，版本必须固定（venv 安装，避免 runner 漂移）。
      - name: Set up pinned SBOM toolchain
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --disable-pip-version-check -q \
            -r scripts/requirements-sbom.txt
          echo "SBOM_PYTHON=${RUNNER_TEMP}/sbom-venv/bin/python3" >> "${GITHUB_ENV}"
          "${RUNNER_TEMP}/sbom-venv/bin/python3" -c \
            "import yaml; print('pinned PyYAML', yaml.__version__)"
      - run: flutter analyze
      - run: flutter test

      # 正式发布必须使用 release keystore；缺失时故意失败，禁止 debug-key fallback。
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is required for release" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is required for release" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/zcode-app-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=zcode-app\nstoreFile=zcode-app-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties

      # R2：发布契约是 arm64 单包，构建必须钉死目标 ABI。
      - run: flutter build apk --release --target-platform=android-arm64

      # R2：自动验证产物只含 arm64-v8a，不靠文件名装样子。
      # PR18*：同时校验签名证书与上一稳定版一致（密钥轮换须走显式流程）。
      - name: Verify arm64-only ABI and signer continuity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, sys
          names = zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk').namelist()
          abis = {n.split('/')[1] for n in names if n.startswith('lib/')}
          print('ABIs in APK:', sorted(abis))
          if abis != {'arm64-v8a'}:
              sys.exit(f'unexpected ABIs: {sorted(abis)}')
          PY
          BUILD_TOOLS="$(ls -d "${ANDROID_SDK_ROOT}/build-tools/"*/ | sort -V | tail -1)"
          SIGNER="$("${BUILD_TOOLS}apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
            | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f')"
          if [ -z "${SIGNER}" ]; then
            echo "cannot read APK signer certificate digest" >&2
            exit 1
          fi
          if [ "${SIGNER}" != "${PREV_SIGNER_SHA256:-}" ]; then
            echo "REFUSED: APK signer ${SIGNER} != previous stable release signer ${PREV_SIGNER_SHA256:-<unknown>}" >&2
            exit 1
          fi
          echo "APK_SIGNER_SHA256=${SIGNER}" >> "${GITHUB_ENV}"
          echo "signer continuity OK: ${SIGNER}"

      # PR19/F22：release 运行时依赖清单（只读）。用 init script 注入，不改动
      # 应用构建脚本，也不引入第三方 Gradle 插件；必须趁签名材料还在时运行
      # （release 变体的配置本身要求 keystore 存在）。
      - name: Export Gradle runtime dependency inventory
        run: |
          set -euo pipefail
          mkdir -p build/sbom
          # gradlew 是 bash 脚本（Ubuntu 的 /bin/sh 是 dash，会在 wrapper 的
          # bash 语法上报 "Syntax error: ( unexpected"）；仓库里也没有可执行位
          # （Windows 检出），所以显式用 bash 调用。
          (cd android && bash ./gradlew \
            -I "${GITHUB_WORKSPACE}/scripts/sbom/gradle-inventory.gradle" \
            zrSbomInventory \
            -PzrSbomOut="${GITHUB_WORKSPACE}/build/sbom/gradle-inventory.json" \
            --console=plain)
          test -s build/sbom/gradle-inventory.json

      # PR18*：签名密钥只在本作业内存在，构建完成后立即从工作区移除。
      - name: Remove signing material from the workspace
        if: always()
        run: rm -f android/app/zcode-app-release.jks android/key.properties
      # 资产名遵循应用内更新器的确定性契约：ZCode-v<version>.apk。
      # PR19/F22：SBOM 合并三层清单（Dart lock + Gradle release 运行时 + APK 原生库），
      # 并把这次 APK 的 SHA-256 写进 SBOM 根组件，使"SBOM ↔ 这份 APK"可核对。
      - name: Package candidate assets, SBOM and release manifest
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          cp app-release.apk "ZCode-v${VERSION}.apk"
          sha256sum "ZCode-v${VERSION}.apk" > "ZCode-v${VERSION}.apk.sha256"
          FLUTTER_JSON=$(flutter --version --machine)
          FLUTTER_VERSION=$(printf '%s' "${FLUTTER_JSON}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin).get('frameworkVersion','unknown'))")
          DART_VERSION=$(printf '%s' "${FLUTTER_JSON}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin).get('dartSdkVersion','unknown'))")
          ENGINE_REVISION=$(printf '%s' "${FLUTTER_JSON}" | python3 -c \
            "import json,sys; print(json.load(sys.stdin).get('engineRevision',''))")
          AGP_VERSION=$(grep -oE 'com\.android\.application"\) version "[0-9.]+' \
            "${GITHUB_WORKSPACE}/android/settings.gradle.kts" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          "${SBOM_PYTHON}" "${GITHUB_WORKSPACE}/scripts/generate-sbom.py" \
            --out "ZCode-v${VERSION}.sbom.cyclonedx.json" \
            --version "${VERSION}" \
            --gradle-inventory "${GITHUB_WORKSPACE}/build/sbom/gradle-inventory.json" \
            --apk "ZCode-v${VERSION}.apk" \
            --flutter-version "${FLUTTER_VERSION}" \
            --dart-version "${DART_VERSION}" \
            --engine-revision "${ENGINE_REVISION}" \
            --agp-version "${AGP_VERSION}"
          VERSION_CODE=$(grep -E '^version:' "${GITHUB_WORKSPACE}/pubspec.yaml" | sed -E 's/.*\+([0-9]+).*/\1/')
          MANIFEST_VERSION="${VERSION}" \
          MANIFEST_VERSION_CODE="${VERSION_CODE}" \
          MANIFEST_COMMIT="${GITHUB_SHA}" \
          MANIFEST_APK="ZCode-v${VERSION}.apk" \
          MANIFEST_APK_SHA256="$(sha256sum "ZCode-v${VERSION}.apk" | awk '{print $1}')" \
          MANIFEST_FLUTTER="${FLUTTER_VERSION}" \
          MANIFEST_DART="${DART_VERSION}" \
          MANIFEST_SIGNER_SHA256="${APK_SIGNER_SHA256}" \
          MANIFEST_SBOM="ZCode-v${VERSION}.sbom.cyclonedx.json" \
          python3 "${GITHUB_WORKSPACE}/scripts/generate-release-manifest.py" > release-manifest.json
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate manifest, digest consistency and SBOM coverage
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/verify-release-artifacts.py \
            --dir build/app/outputs/flutter-apk \
            --version "${VERSION}" \
            --sbom "build/app/outputs/flutter-apk/ZCode-v${VERSION}.sbom.cyclonedx.json"

      # R-18：插件存活门——绑定**本次**构建的 APK 与 mapping，防止"插件被 R8
      # 剥掉"（历史事故：shared_preferences 缺失 → 锁屏死锁）与"另一个构建的
      # mapping 冒充本次产物"。空 APK / 空 mapping / 摘要不一致都会 fail。
      - name: Plugin survival gate (APK ↔ mapping ↔ manifest bound)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          python3 "${GITHUB_WORKSPACE}/scripts/check-plugin-survival.py" \
            --apk "ZCode-v${VERSION}.apk" \
            --mapping "${GITHUB_WORKSPACE}/build/app/outputs/mapping/release/mapping.txt" \
            --manifest release-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zcode-app-release
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/ZCode-v*.apk
            build/app/outputs/flutter-apk/ZCode-v*.apk.sha256
            build/app/outputs/flutter-apk/ZCode-v*.sbom.cyclonedx.json
            build/app/outputs/flutter-apk/release-manifest.json

  # 3) 发布作业：不接触任何签名材料，只做校验、来源证明与发布。
  publish:
    needs: [verify, build-sign]
    if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zcode-app-release
          path: dist

      # 幂等：已存在的 Release 绝不覆盖（重发必须走新的补丁版本）。
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "REFUSED: release ${GITHUB_REF_NAME} already exists; publish a new patch version instead." >&2
            exit 1
          fi

      - name: Validate manifest, digest consistency and SBOM coverage
        run: |
          set -euo pipefail
          python3 scripts/verify-release-artifacts.py \
            --dir dist \
            --version "${GITHUB_REF_NAME#v}" \
            --sbom "dist/ZCode-v${GITHUB_REF_NAME#v}.sbom.cyclonedx.json"

      # PR19/F22 依赖门禁：SBOM 里每个随包发布的组件都过一遍 OSV，
      # high/critical 未豁免即拒绝发布（发布阶段 fail-closed，网络不可达也算失败：
      # 不允许在"未知依赖状态"下发版；重跑 workflow 即可）。
      - name: Dependency advisory gate (OSV)
        run: |
          python3 scripts/check-dependency-advisories.py \
            --sbom "dist/ZCode-v${GITHUB_REF_NAME#v}.sbom.cyclonedx.json" \
            --fail-on high

      # APK 产物来源证明——用户可用 `gh attestation verify` 验证这个 APK 由本仓库构建。
      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/ZCode-v*.apk

      # 生成后立即自验证，并交叉核对 attestation 主题摘要 == APK SHA256。
      - name: Self-verify attestation and cross-check subject digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "dist/ZCode-v${GITHUB_REF_NAME#v}.apk" \
            --repo "${GITHUB_REPOSITORY}" --format json > attestation.json
          python3 scripts/verify-release-artifacts.py \
            --dir dist \
            --version "${GITHUB_REF_NAME#v}" \
            --attestation-json attestation.json

      # 发布说明：优先使用 docs/releases/<tag>.md；缺失时退回自动生成。
      - name: Prepare release notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
          else
            echo "> 本次未提供 docs/releases/${GITHUB_REF_NAME}.md，以下条目由 GitHub 自动生成。" > release-notes.md
          fi

      # v1.1.0 计划：默认发 Pre-release（应用内更新器只认 /releases/latest，
      # 不会向用户推送）；真机矩阵与 soak 完成后由维护者手动转正式：
      #   gh release edit <tag> --prerelease=false
      - name: GitHub Release (pre-release)
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ZCode-v*.apk
            dist/ZCode-v*.apk.sha256
            dist/ZCode-v*.sbom.cyclonedx.json
            dist/release-manifest.json

      # 最终一致性：重新下载"已发布"的资产并再验一次摘要（证明上传后的字节正确）。
      - name: Re-download published assets and re-verify digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir redownload
          python3 scripts/verify-release-artifacts.py \
            --dir redownload \
            --version "${GITHUB_REF_NAME#v}"
